# ---------------------------------------------------------------------------
# ساخت نرم‌افزار «دسترسی راه دور موسسه» روی ماشین ابری گیت‌هاب
#
# این فایل بر اساس گردش‌کار رسمی خود راست‌دسک نوشته شده تا احتمال موفقیت
# بیشینه باشد: همان نسخهٔ فلاتر، همان نسخهٔ LLVM، همان ابزار پل، همان
# دستور ساخت. تفاوت تنها در این است که پیش از ساخت، هویت بصری موسسه
# (نام، نشان، رنگ‌ها و پنل اختصاصی) روی سورس اعمال می‌شود.
# ---------------------------------------------------------------------------

name: ساخت نرم‌افزار دسترسی راه دور موسسه

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

env:
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  FLUTTER_ROOT_DIR: "C:/hostedtoolcache/windows/flutter/stable-3.24.5-x64"
  LLVM_VERSION: "15.0.6"
  RUST_VERSION: "1.75"
  BRIDGE_VERSION: "1.80.1"
  CARGO_EXPAND_VERSION: "1.0.95"
  VCPKG_ROOT: "C:\\vcpkg"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_DEFAULT_HOST_TRIPLET: "x64-windows-static"
  RUSTDESK_REPO: "https://github.com/rustdesk/rustdesk.git"
  RUSTDESK_REF: "master"
  SRC_DIR: "rustdesk-src"
  DIST_NAME: "NRISP-Remote"

jobs:
  # -------------------------------------------------------------------------
  # کار یکم: تولید پل فلاتر↔راست (همان‌طور که خود راست‌دسک روی لینوکس می‌سازد)
  # -------------------------------------------------------------------------
  bridge:
    name: تولید پل فلاتر و راست
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: گرفتن سورس راست‌دسک
        shell: bash
        run: |
          git clone --depth 1 --branch "$RUSTDESK_REF" --recurse-submodules --shallow-submodules \
            "$RUSTDESK_REPO" "$SRC_DIR" \
            || git clone --depth 1 --recurse-submodules --shallow-submodules "$RUSTDESK_REPO" "$SRC_DIR"

      - name: نصب پیش‌نیازها
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev llvm-dev ninja-build pkg-config wget

      - name: نصب Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: نگه‌داشتن ابزار پل
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
          key: bridge-tools-${{ env.BRIDGE_VERSION }}

      - name: نصب فلاتر
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: ساخت پل
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          command -v cargo-expand >/dev/null 2>&1 || cargo install cargo-expand --version "$CARGO_EXPAND_VERSION" --locked
          command -v flutter_rust_bridge_codegen >/dev/null 2>&1 || \
            cargo install flutter_rust_bridge_codegen --version "$BRIDGE_VERSION" --features uuid --locked
          cd "$SRC_DIR"
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          (cd flutter && flutter pub get)
          "$HOME/.cargo/bin/flutter_rust_bridge_codegen" \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
          mkdir -p /tmp/bridge
          cp ./src/bridge_generated.rs /tmp/bridge/ 2>/dev/null || true
          cp ./src/bridge_generated.io.rs /tmp/bridge/ 2>/dev/null || true
          cp ./flutter/lib/generated_bridge.dart /tmp/bridge/
          cp ./flutter/lib/generated_bridge.freezed.dart /tmp/bridge/ 2>/dev/null || true
          cp ./flutter/macos/Runner/bridge_generated.h /tmp/bridge/
          ls -la /tmp/bridge

      - name: بارگذاری پل
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: /tmp/bridge/*
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # کار دوم: ساخت نسخهٔ ویندوز ۶۴ بیتی + بسته‌بندی + بارگذاری
  # -------------------------------------------------------------------------
  windows:
    name: ساخت نسخهٔ ویندوز
    needs: bridge
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - name: گرفتن فایل‌های این مخزن
        uses: actions/checkout@v4

      - name: گرفتن سورس راست‌دسک
        shell: bash
        run: |
          git clone --depth 1 --branch "$RUSTDESK_REF" --recurse-submodules --shallow-submodules \
            "$RUSTDESK_REPO" "$SRC_DIR" \
            || git clone --depth 1 --recurse-submodules --shallow-submodules "$RUSTDESK_REPO" "$SRC_DIR"
          cd "$SRC_DIR" && git log --oneline -1

      - name: گذاشتن فایل پل در سورس
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: bridge-files

      - name: انتقال فایل‌های پل
        shell: bash
        run: |
          cp bridge-files/bridge_generated.rs    "$SRC_DIR/src/" 2>/dev/null || true
          cp bridge-files/bridge_generated.io.rs "$SRC_DIR/src/" 2>/dev/null || true
          cp bridge-files/generated_bridge.dart  "$SRC_DIR/flutter/lib/"
          cp bridge-files/generated_bridge.freezed.dart "$SRC_DIR/flutter/lib/" 2>/dev/null || true
          mkdir -p "$SRC_DIR/flutter/macos/Runner" "$SRC_DIR/flutter/ios/Runner"
          cp bridge-files/bridge_generated.h "$SRC_DIR/flutter/macos/Runner/" 2>/dev/null || true
          cp bridge-files/bridge_generated.h "$SRC_DIR/flutter/ios/Runner/" 2>/dev/null || true
          ls -la "$SRC_DIR/src" | grep bridge_generated || true
          ls -la "$SRC_DIR/flutter/lib" | grep generated_bridge

      - name: نصب LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: نصب Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: نصب Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
          cache: true

      - name: آماده‌سازی vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: نگه‌داشتن کتابخانه‌ها
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-${{ env.VCPKG_COMMIT_ID }}-x64-windows-static

      - name: جایگزینی موتور فلاتر با موتور سفارشی راست‌دسک
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $dest = "${{ env.FLUTTER_ROOT_DIR }}/bin/cache/artifacts/engine/windows-x64-release"
          if (Test-Path $dest) { Remove-Item -Recurse -Force "$dest/*" }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Recurse -Force windows-x64-release/* $dest
          Get-ChildItem $dest | Select-Object -First 6 Name

      - name: اعمال وصلهٔ فلاتر
        shell: bash
        run: |
          FLUTTER_BIN_DIR=$(dirname $(dirname $(which flutter)))
          cp "$SRC_DIR/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff" "$FLUTTER_BIN_DIR/" || true
          cd "$FLUTTER_BIN_DIR"
          if [ -f flutter_3.24.4_dropdown_menu_enableFilter.diff ]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff && echo "وصله اعمال شد" || echo "وصله از قبل اعمال شده"
          fi

      - name: نصب کتابخانه‌های تصویر و صدا
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          cd "$SRC_DIR"
          if ! "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static \
               --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do echo "== $f"; cat "$f"; done
            exit 1
          fi

      - name: ساخت آیکون‌ها از فایل تنظیمات برند
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pillow brotli
          python branding/tools/generate_icons.py

      - name: اعمال هویت بصری موسسه روی سورس
        shell: bash
        run: |
          python branding/tools/apply_branding.py --repo "$SRC_DIR" --rename-exe --android-package --ui
          echo "=== کنترل اعمال برند ==="
          grep -c "NRISP Remote Access" "$SRC_DIR/src/common.rs" || true
          ls -la "$SRC_DIR/flutter/lib/nrisp/" || true

      - name: خواندن نام فایل اجرایی از فایل تنظیمات
        id: cfg
        shell: bash
        run: |
          EXE=$(python -c "import json;print(json.load(open('branding/branding.json',encoding='utf-8'))['exe_name'])")
          echo "EXE_NAME=$EXE" >> "$GITHUB_OUTPUT"
          echo "نام فایل اجرایی: $EXE"

      - name: کامپایل برنامه
        shell: bash
        working-directory: ${{ env.SRC_DIR }}
        run: |
          python3 ./build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          ls -la flutter/build/windows/x64/runner/Release | head -20
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk-dist

      - name: افزودن درایور نمایشگر مجازی و چاپگر
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath usbmmidd_v2
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse -ErrorAction SilentlyContinue
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe","usbmmidd_v2\deviceinstaller.exe","usbmmidd_v2\usbmmidd.bat" -ErrorAction SilentlyContinue
          Move-Item -Force ./usbmmidd_v2 "${{ env.SRC_DIR }}/rustdesk-dist/"
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile drv.zip
            Expand-Archive drv.zip -DestinationPath drv
            New-Item -ItemType Directory -Force -Path "${{ env.SRC_DIR }}/rustdesk-dist/drivers" | Out-Null
            Move-Item -Force ./drv/rustdesk_printer_driver_v4-1.4 "${{ env.SRC_DIR }}/rustdesk-dist/drivers/RustDeskPrinterDriver"
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile adapter.zip
            Expand-Archive adapter.zip -DestinationPath adapter
            Copy-Item -Force ./adapter/printer_driver_adapter.dll "${{ env.SRC_DIR }}/rustdesk-dist/"
          } catch { Write-Host "درایور چاپگر رد شد (اختیاری)" }

      - name: ساخت افزونهٔ حالت حریم خصوصی
        continue-on-error: true
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/rustdesk-org/RustDeskTempTopMostWindow "${{ github.workspace }}\ttmw"
          Set-Location "${{ github.workspace }}\ttmw"
          git fetch --depth 1 origin ecd8d6a139eee76845ea66423fb739af450fda90
          git checkout ecd8d6a139eee76845ea66423fb739af450fda90
          $msbuild = (Get-Command msbuild -ErrorAction SilentlyContinue).Source
          if (-not $msbuild) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          }
          & $msbuild "WindowInjection\WindowInjection.vcxproj" -p:Configuration=Release -p:Platform=x64
          $dll = Get-ChildItem -Recurse -Filter WindowInjection.dll | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName "${{ github.workspace }}\${{ env.SRC_DIR }}\rustdesk-dist\" ; Write-Host "افزونه کپی شد" }

      - name: یافتن Runner.res
        shell: bash
        continue-on-error: true
        run: |
          cd "$SRC_DIR"
          res=$(find . -name "Runner.res" | head -1)
          if [ -n "$res" ]; then cp "$res" ./libs/portable/Runner.res; ls -l ./libs/portable/Runner.res; fi

      - name: بسته‌بندی فایل نصبی
        shell: bash
        working-directory: ${{ env.SRC_DIR }}
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          DIST="$PWD/rustdesk-dist"
          EXE="$DIST/${{ steps.cfg.outputs.EXE_NAME }}.exe"
          ls -la "$EXE"
          # هویت بسته‌بند
          sed -i 's|ProductName = "RustDesk"|ProductName = "دسترسی راه دور موسسه"|' libs/portable/Cargo.toml || true
          sed -i 's|OriginalFilename = "rustdesk.exe"|OriginalFilename = "nrisp-remote.exe"|' libs/portable/Cargo.toml || true
          sed -i 's|FileDescription = "RustDesk Remote Desktop"|FileDescription = "NRISP Remote Access"|' libs/portable/Cargo.toml || true
          sed -i 's|LegalCopyright = "Copyright © 2026 Purslane Tech Pte. Ltd. All rights reserved."|LegalCopyright = "© موسسه تحقیقات سیاست علمی کشور ۱۴۰۵"|' libs/portable/Cargo.toml || true
          sed -i '/dpiAware/d' res/manifest.xml || true
          cd libs/portable
          python -m pip install --quiet -r requirements.txt
          python ./generate.py -f "$DIST/" -o . -e "$EXE"
          ls -la target/release/ | grep -i packer
          cp target/release/rustdesk-portable-packer.exe "$GITHUB_WORKSPACE/${{ env.DIST_NAME }}-$VERSION-install.exe"
          ls -la "$GITHUB_WORKSPACE/${{ env.DIST_NAME }}-$VERSION-install.exe"

      - name: بسته‌بندی نسخهٔ پرتابل
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ github.workspace }}\${{ env.SRC_DIR }}\rustdesk-dist\*" -DestinationPath "${{ github.workspace }}\${{ env.DIST_NAME }}-portable.zip" -Force
          Get-Item "${{ github.workspace }}\${{ env.DIST_NAME }}-portable.zip" | Select-Object Length, Name

      - name: بارگذاری فایل نصبی
        uses: actions/upload-artifact@v4
        with:
          name: NRISP-Remote-installer
          path: NRISP-Remote-*-install.exe
          if-no-files-found: error
          retention-days: 30

      - name: بارگذاری نسخهٔ پرتابل
        uses: actions/upload-artifact@v4
        with:
          name: NRISP-Remote-portable
          path: NRISP-Remote-portable.zip
          if-no-files-found: error
          retention-days: 30

# ---------------------------------------------------------------------------
# ساخت نرم‌افزار «دسترسی راه دور موسسه» روی ماشین ابری گیت‌هاب
#
# این فایل بر اساس گردش‌کار رسمی خود راست‌دسک نوشته شده تا احتمال موفقیت
# بیشینه باشد: همان نسخهٔ فلاتر، همان نسخهٔ LLVM، همان ابزار پل، همان
# دستور ساخت. تفاوت تنها در این است که پیش از ساخت، هویت بصری موسسه
# (نام، نشان، رنگ‌ها و پنل اختصاصی) روی سورس اعمال می‌شود.
# ---------------------------------------------------------------------------

name: ساخت نرم‌افزار دسترسی راه دور موسسه

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

# اجازهٔ نوشتن برای اینکه خود ساخت، نتیجه را در بخش Releases بگذارد
permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  FLUTTER_VERSION: "3.24.5"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  FLUTTER_ROOT_DIR: "C:/hostedtoolcache/windows/flutter/stable-3.24.5-x64"
  LLVM_VERSION: "15.0.6"
  RUST_VERSION: "1.75"
  BRIDGE_VERSION: "1.80.1"
  CARGO_EXPAND_VERSION: "1.0.95"
  VCPKG_ROOT: "C:\\vcpkg"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_DEFAULT_HOST_TRIPLET: "x64-windows-static"
  RUSTDESK_REPO: "https://github.com/rustdesk/rustdesk.git"
  RUSTDESK_REF: "master"
  SRC_DIR: "rustdesk-src"
  DIST_NAME: "NRISP-Remote"

jobs:
  # -------------------------------------------------------------------------
  # کار یکم: تولید پل فلاتر↔راست (همان‌طور که خود راست‌دسک روی لینوکس می‌سازد)
  # -------------------------------------------------------------------------
  bridge:
    name: تولید پل فلاتر و راست
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: گرفتن فایل‌های این مخزن
        uses: actions/checkout@v4

      - name: ثبت وضعیت آغاز کار پل
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash branding/tools/ci_mark.sh "آغاز کار پل"

      - name: خاموش‌کردن تبدیل خطوط
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: گرفتن سورس راست‌دسک
        shell: bash
        run: |
          git clone --depth 1 --branch "$RUSTDESK_REF" --recurse-submodules --shallow-submodules \
            "$RUSTDESK_REPO" "$SRC_DIR" \
            || git clone --depth 1 --recurse-submodules --shallow-submodules "$RUSTDESK_REPO" "$SRC_DIR"

      - name: نصب پیش‌نیازها
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake curl gcc git g++ libclang-dev llvm-dev ninja-build pkg-config wget

      - name: نصب Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: نگه‌داشتن ابزار پل
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
          key: bridge-tools-${{ env.BRIDGE_VERSION }}

      - name: نصب فلاتر
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: ساخت پل
        shell: bash
        run: |
          exec > >(tee "$GITHUB_WORKSPACE/bridge-log.txt") 2>&1
          export PATH="$HOME/.cargo/bin:$PATH"
          command -v cargo-expand >/dev/null 2>&1 || cargo install cargo-expand --version "$CARGO_EXPAND_VERSION" --locked
          command -v flutter_rust_bridge_codegen >/dev/null 2>&1 || \
            cargo install flutter_rust_bridge_codegen --version "$BRIDGE_VERSION" --features uuid --locked
          cd "$SRC_DIR"
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          (cd flutter && flutter pub get)
          "$HOME/.cargo/bin/flutter_rust_bridge_codegen" \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
          mkdir -p /tmp/bridge
          cp ./src/bridge_generated.rs /tmp/bridge/ 2>/dev/null || true
          cp ./src/bridge_generated.io.rs /tmp/bridge/ 2>/dev/null || true
          cp ./flutter/lib/generated_bridge.dart /tmp/bridge/
          cp ./flutter/lib/generated_bridge.freezed.dart /tmp/bridge/ 2>/dev/null || true
          cp ./flutter/macos/Runner/bridge_generated.h /tmp/bridge/
          ls -la /tmp/bridge

      - name: ثبت وضعیت پل فلاتر و راست ساخته شد
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash branding/tools/ci_mark.sh "پل فلاتر و راست ساخته شد"

      - name: بارگذاری پل
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: /tmp/bridge/*
          if-no-files-found: error

      - name: آماده‌کردن گزارش خطا
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          {
            echo "اجرا: ${{ github.run_id }} | کار: bridge | زمان: $(date -u)"
            echo "===== پایان گزارش ساخت پل ====="
            tail -n 400 "$GITHUB_WORKSPACE/bridge-log.txt" 2>/dev/null || echo "گزارشی ذخیره نشد"
          } > "$GITHUB_WORKSPACE/ci-failure-bridge.txt"

      - name: گذاشتن گزارش خطا در Releases
        if: failure()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fail-${{ github.run_number }}
          name: "گزارش خطای ساخت پل - اجرای ${{ github.run_number }}"
          body: "گزارش خودکار خطای مرحلهٔ پل فلاتر و راست."
          files: ci-failure-bridge.txt

  # -------------------------------------------------------------------------
  # کار دوم: ساخت نسخهٔ ویندوز ۶۴ بیتی + بسته‌بندی + بارگذاری
  # -------------------------------------------------------------------------
  windows:
    name: ساخت نسخهٔ ویندوز
    needs: bridge
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - name: گرفتن فایل‌های این مخزن
        uses: actions/checkout@v4

      - name: ثبت وضعیت فایل‌های مخزن گرفته شد
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash branding/tools/ci_mark.sh "فایل‌های مخزن گرفته شد"

      - name: خاموش‌کردن تبدیل خطوط
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: گرفتن سورس راست‌دسک
        shell: bash
        run: |
          git config --global core.autocrlf false
          git clone --depth 1 --branch "$RUSTDESK_REF" --recurse-submodules --shallow-submodules \
            "$RUSTDESK_REPO" "$SRC_DIR" \
            || git clone --depth 1 --recurse-submodules --shallow-submodules "$RUSTDESK_REPO" "$SRC_DIR"
          cd "$SRC_DIR" && git log --oneline -1

      - name: گذاشتن فایل پل در سورس
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: bridge-files

      - name: ثبت وضعیت سورس راست‌دسک گرفته شد
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash branding/tools/ci_mark.sh "سورس راست‌دسک گرفته شد"

      - name: انتقال فایل‌های پل
        shell: bash
        run: |
          cp bridge-files/bridge_generated.rs    "$SRC_DIR/src/" 2>/dev/null || true
          cp bridge-files/bridge_generated.io.rs "$SRC_DIR/src/" 2>/dev/null || true
          cp bridge-files/generated_bridge.dart  "$SRC_DIR/flutter/lib/"
          cp bridge-files/generated_bridge.freezed.dart "$SRC_DIR/flutter/lib/" 2>/dev/null || true
          mkdir -p "$SRC_DIR/flutter/macos/Runner" "$SRC_DIR/flutter/ios/Runner"
          cp bridge-files/bridge_generated.h "$SRC_DIR/flutter/macos/Runner/" 2>/dev/null || true
          cp bridge-files/bridge_generated.h "$SRC_DIR/flutter/ios/Runner/" 2>/dev/null || true
          ls -la "$SRC_DIR/src" | grep bridge_generated || true
          ls -la "$SRC_DIR/flutter/lib" | grep generated_bridge

      - name: نصب LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: نصب Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: ثبت وضعیت فایل‌های پل منتقل شد
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash branding/tools/ci_mark.sh "فایل‌های پل منتقل شد"

      - name: نصب Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64
          cache: true

      - name: آماده‌سازی vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ env.VCPKG_ROOT }}
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: ثبت وضعیت ابزارهای ساخت نصب شد
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash branding/tools/ci_mark.sh "ابزارهای ساخت نصب شد"

      - name: نگه‌داشتن کتابخانه‌ها
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-${{ env.VCPKG_COMMIT_ID }}-x64-windows-static

      - name: ثبت وضعیت کتابخانه‌های تصویر و صدا نصب شد
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash branding/tools/ci_mark.sh "کتابخانه‌های تصویر و صدا نصب شد"

      - name: جایگزینی موتور فلاتر با موتور سفارشی راست‌دسک
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $dest = "${{ env.FLUTTER_ROOT_DIR }}/bin/cache/artifacts/engine/windows-x64-release"
          if (Test-Path $dest) { Remove-Item -Recurse -Force "$dest/*" }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Recurse -Force windows-x64-release/* $dest
          Get-ChildItem $dest | Select-Object -First 6 Name

      - name: اعمال وصلهٔ فلاتر
        shell: bash
        run: |
          FLUTTER_BIN_DIR=$(dirname $(dirname $(which flutter)))
          cp "$SRC_DIR/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff" "$FLUTTER_BIN_DIR/" || true
          cd "$FLUTTER_BIN_DIR"
          if [ -f flutter_3.24.4_dropdown_menu_enableFilter.diff ]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff && echo "وصله اعمال شد" || echo "وصله از قبل اعمال شده"
          fi

      - name: نصب کتابخانه‌های تصویر و صدا
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          cd "$SRC_DIR"
          set -o pipefail
          if ! "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static \
               --x-install-root="$VCPKG_ROOT/installed" 2>&1 | tee "$GITHUB_WORKSPACE/vcpkg-log.txt"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r f; do echo "== $f"; cat "$f"; done
            exit 1
          fi

      - name: ثبت وضعیت موتور فلاتر آماده شد
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash branding/tools/ci_mark.sh "موتور فلاتر آماده شد"

      - name: ساخت آیکون‌ها از فایل تنظیمات برند
        shell: bash
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/branding-log.txt") 2>&1
          echo "=== مرحلهٔ ساخت آیکون‌ها ==="
          python -m pip install --quiet --upgrade pip || true
          python -m pip install --quiet pillow brotli || true
          python -c "from PIL import Image; import brotli; print('کتابخانه‌های تصویر آماده‌اند')"
          python branding/tools/generate_icons.py || { echo "خطا در ساخت آیکون‌ها"; exit 1; }
          ls -la branding/out/

      - name: ثبت وضعیت آیکون‌ها ساخته شد
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash branding/tools/ci_mark.sh "آیکون‌ها ساخته شد"

      - name: اعمال هویت بصری موسسه روی سورس
        shell: bash
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/branding-log.txt") 2>&1
          echo "=== مرحلهٔ اعمال هویت بصری ==="
          python branding/tools/apply_branding.py --repo "$SRC_DIR" --rename-exe --android-package --ui || { echo "خطا در اعمال برند"; exit 1; }
          echo "=== کنترل اعمال برند ==="
          grep -c "NRISP Remote Access" "$SRC_DIR/src/common.rs" || true
          ls -la "$SRC_DIR/flutter/lib/nrisp/" || true

      - name: ثبت وضعیت برند روی سورس اعمال شد
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash branding/tools/ci_mark.sh "برند روی سورس اعمال شد"

      - name: فارسی‌سازی و زیباسازی رابط کاربری
        shell: bash
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/branding-log.txt") 2>&1
          echo "=== مرحلهٔ فارسی‌سازی و زیباسازی رابط کاربری ==="
          python branding/tools/nrisp_ui.py --repo "$SRC_DIR" || { echo "خطا در فارسی‌سازی"; exit 1; }

      - name: ثبت وضعیت رابط کاربری فارسی و بازطراحی شد
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash branding/tools/ci_mark.sh "رابط کاربری فارسی و بازطراحی شد"


      - name: کنترل کیفیت اعمال هویت بصری
        shell: bash
        run: |
          set -e
          EXE=$(python -c "import json;print(json.load(open('branding/branding.json',encoding='utf-8'))['exe_name'])")
          echo "نام فایل اجرایی مورد انتظار: $EXE"
          grep -q "set(BINARY_NAME \"$EXE\")" "$SRC_DIR/flutter/windows/CMakeLists.txt" \
            && echo "نام فایل اجرایی درست تنظیم شده" \
            || { echo "خطا: نام فایل اجرایی تنظیم نشد"; tail -n 60 "$GITHUB_WORKSPACE/branding-log.txt"; exit 1; }
          grep -q "NrispIdPanel" "$SRC_DIR/flutter/lib/desktop/pages/desktop_home_page.dart" \
            && echo "پنل اختصاصی در صفحهٔ اصلی جای گرفت" \
            || { echo "خطا: پنل اختصاصی در صفحهٔ اصلی جای نگرفت"; tail -n 60 "$GITHUB_WORKSPACE/branding-log.txt"; exit 1; }
          grep -q "nrisp" "$SRC_DIR/src/common.rs" \
            && echo "نام برنامه در سورس راست تنظیم شد" \
            || { echo "خطا: نام برنامه در سورس راست تنظیم نشد"; tail -n 60 "$GITHUB_WORKSPACE/branding-log.txt"; exit 1; }
          grep -q "locale: const Locale('fa')" "$SRC_DIR/flutter/lib/main.dart" \
            && echo "زبان پیش‌فرض فارسی تنظیم شد" \
            || { echo "خطا: زبان پیش‌فرض فارسی تنظیم نشد"; exit 1; }
          grep -q "nrispAppNameFa" "$SRC_DIR/flutter/lib/desktop/widgets/tabbar_widget.dart" \
            && echo "نام نرم‌افزار در نوار بالا تنظیم شد" \
            || { echo "خطا: نام نرم‌افزار در نوار بالا تنظیم نشد"; exit 1; }
          grep -q "nrispAppNameFa" "$SRC_DIR/flutter/lib/nrisp/nrisp_id_panel.dart" \
            && echo "پنل اختصاصی فارسی در جای خود است" \
            || { echo "خطا: پنل اختصاصی جای نگرفت"; exit 1; }

      - name: ثبت وضعیت هویت بصری موسسه روی سورس اعمال شد
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash branding/tools/ci_mark.sh "هویت بصری موسسه روی سورس اعمال شد"

      - name: خواندن نام فایل اجرایی از فایل تنظیمات
        id: cfg
        shell: bash
        run: |
          EXE=$(python -c "import json;print(json.load(open('branding/branding.json',encoding='utf-8'))['exe_name'])")
          echo "EXE_NAME=$EXE" >> "$GITHUB_OUTPUT"
          echo "نام فایل اجرایی: $EXE"

      - name: کامپایل برنامه
        shell: bash
        working-directory: ${{ env.SRC_DIR }}
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build-log.txt") 2>&1
          echo "=== مرحلهٔ کامپایل ==="
          python3 ./build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          echo "=== خروجی ساخت ==="
          ls -la flutter/build/windows/x64/runner/Release
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk-dist
          ls -la ./rustdesk-dist

      - name: ثبت وضعیت کامپایل برنامه به پایان رسید
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash branding/tools/ci_mark.sh "کامپایل برنامه به پایان رسید"

      - name: افزودن درایور نمایشگر مجازی و چاپگر
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath usbmmidd_v2
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse -ErrorAction SilentlyContinue
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe","usbmmidd_v2\deviceinstaller.exe","usbmmidd_v2\usbmmidd.bat" -ErrorAction SilentlyContinue
          Move-Item -Force ./usbmmidd_v2 "${{ env.SRC_DIR }}/rustdesk-dist/"
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile drv.zip
            Expand-Archive drv.zip -DestinationPath drv
            New-Item -ItemType Directory -Force -Path "${{ env.SRC_DIR }}/rustdesk-dist/drivers" | Out-Null
            Move-Item -Force ./drv/rustdesk_printer_driver_v4-1.4 "${{ env.SRC_DIR }}/rustdesk-dist/drivers/RustDeskPrinterDriver"
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile adapter.zip
            Expand-Archive adapter.zip -DestinationPath adapter
            Copy-Item -Force ./adapter/printer_driver_adapter.dll "${{ env.SRC_DIR }}/rustdesk-dist/"
          } catch { Write-Host "درایور چاپگر رد شد (اختیاری)" }

      - name: ساخت افزونهٔ حالت حریم خصوصی
        continue-on-error: true
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/rustdesk-org/RustDeskTempTopMostWindow "${{ github.workspace }}\ttmw"
          Set-Location "${{ github.workspace }}\ttmw"
          git fetch --depth 1 origin ecd8d6a139eee76845ea66423fb739af450fda90
          git checkout ecd8d6a139eee76845ea66423fb739af450fda90
          $msbuild = (Get-Command msbuild -ErrorAction SilentlyContinue).Source
          if (-not $msbuild) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          }
          & $msbuild "WindowInjection\WindowInjection.vcxproj" -p:Configuration=Release -p:Platform=x64
          $dll = Get-ChildItem -Recurse -Filter WindowInjection.dll | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName "${{ github.workspace }}\${{ env.SRC_DIR }}\rustdesk-dist\" ; Write-Host "افزونه کپی شد" }

      - name: یافتن Runner.res
        shell: bash
        continue-on-error: true
        run: |
          cd "$SRC_DIR"
          res=$(find . -name "Runner.res" | head -1)
          if [ -n "$res" ]; then cp "$res" ./libs/portable/Runner.res; ls -l ./libs/portable/Runner.res; fi

      - name: بسته‌بندی فایل نصبی
        shell: bash
        working-directory: ${{ env.SRC_DIR }}
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/packaging-log.txt") 2>&1
          echo "=== مرحلهٔ بسته‌بندی فایل نصبی ==="
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          DIST="$PWD/rustdesk-dist"
          EXE="$DIST/${{ steps.cfg.outputs.EXE_NAME }}.exe"
          ls -la "$EXE"
          echo "--- محتوای پوشهٔ بسته‌بندی ---"
          ls -la libs/portable
          # هویت بسته‌بند
          sed -i 's|ProductName = "RustDesk"|ProductName = "دسترسی راه دور موسسه"|' libs/portable/Cargo.toml || true
          sed -i 's|OriginalFilename = "rustdesk.exe"|OriginalFilename = "nrisp-remote.exe"|' libs/portable/Cargo.toml || true
          sed -i 's|FileDescription = "RustDesk Remote Desktop"|FileDescription = "NRISP Remote Access"|' libs/portable/Cargo.toml || true
          sed -i 's|LegalCopyright = "Copyright © 2026 Purslane Tech Pte. Ltd. All rights reserved."|LegalCopyright = "© موسسه تحقیقات سیاست علمی کشور ۱۴۰۵"|' libs/portable/Cargo.toml || true
          sed -i '/dpiAware/d' res/manifest.xml || true
          cd libs/portable
          echo "--- نصب پیش‌نیازهای بسته‌بند ---"
          python -m pip install --quiet -r requirements.txt || echo "نصب پیش‌نیاز ناموفق بود (ادامه می‌دهیم)"
          echo "--- اجرای بسته‌بند ---"
          # نکتهٔ مهم: این اسکریپت پس از نوشتن data.bin خودش بسته‌بند را با cargo
          # می‌سازد. چون پوشهٔ بسته‌بند عضو فضای کاری ریشه است، خروجی در
          # target/release ریشهٔ پروژه ساخته می‌شود، نه در پوشهٔ بسته‌بند.
          python -u ./generate.py -f "$DIST/" -o . -e "$EXE"
          echo "--- یافتن فایل بسته‌بند ---"
          PACKER=""
          for c in "target/release/rustdesk-portable-packer.exe" \
                   "../../target/release/rustdesk-portable-packer.exe" \
                   "../../target/x86_64-pc-windows-msvc/release/rustdesk-portable-packer.exe"; do
            if [ -f "$c" ]; then PACKER="$c"; break; fi
          done
          if [ -z "$PACKER" ]; then
            PACKER=$(find ../.. -maxdepth 5 -name "rustdesk-portable-packer.exe" -type f 2>/dev/null | head -1)
          fi
          echo "بسته‌بند: ${PACKER:-پیدا نشد}"
          echo "--- محتوای پوشهٔ هدف ریشه ---"
          ls -la ../../target/release 2>/dev/null | tail -8 || echo "پوشهٔ هدف ریشه نیست"
          if [ -z "$PACKER" ]; then
            echo "خطا: فایل بسته‌بند ساخته نشد"
            exit 1
          fi
          cp "$PACKER" "$GITHUB_WORKSPACE/${{ env.DIST_NAME }}-$VERSION-install.exe"
          ls -la "$GITHUB_WORKSPACE/${{ env.DIST_NAME }}-$VERSION-install.exe"

      - name: بسته‌بندی نسخهٔ پرتابل
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ github.workspace }}\${{ env.SRC_DIR }}\rustdesk-dist\*" -DestinationPath "${{ github.workspace }}\${{ env.DIST_NAME }}-portable.zip" -Force
          Get-Item "${{ github.workspace }}\${{ env.DIST_NAME }}-portable.zip" | Select-Object Length, Name

      - name: بارگذاری فایل نصبی
        uses: actions/upload-artifact@v4
        with:
          name: NRISP-Remote-installer
          path: NRISP-Remote-*-install.exe
          if-no-files-found: error
          retention-days: 30

      - name: بارگذاری نسخهٔ پرتابل
        uses: actions/upload-artifact@v4
        with:
          name: NRISP-Remote-portable
          path: NRISP-Remote-portable.zip
          if-no-files-found: error
          retention-days: 30

      - name: آماده‌کردن گزارش خطا
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            echo "اجرا: ${{ github.run_id }} | کار: windows | زمان: $(date -u)"
            echo "نام فایل اجرایی: ${{ steps.cfg.outputs.EXE_NAME }}"
            echo "===== پایان گزارش کتابخانه‌ها ====="
            tail -n 300 "$GITHUB_WORKSPACE/vcpkg-log.txt" 2>/dev/null || echo "گزارش کتابخانه‌ها ذخیره نشد"
            echo "===== پایان گزارش برند ====="
            tail -n 200 "$GITHUB_WORKSPACE/branding-log.txt" 2>/dev/null || echo "گزارش برند ذخیره نشد"
            echo "===== پایان گزارش کامپایل ====="
            tail -n 500 "$GITHUB_WORKSPACE/build-log.txt" 2>/dev/null || echo "گزارش کامپایل ذخیره نشد"
            echo "===== پایان گزارش بسته‌بندی ====="
            tail -n 200 "$GITHUB_WORKSPACE/packaging-log.txt" 2>/dev/null || echo "گزارش بسته‌بندی ذخیره نشد"
            echo "===== فهرست ریشهٔ کار ====="
            ls -la "$GITHUB_WORKSPACE" 2>/dev/null || true
            echo "===== فهرست خروجی ساخت ====="
            ls -la "$GITHUB_WORKSPACE/$SRC_DIR/rustdesk-dist" 2>/dev/null || echo "پوشهٔ خروجی ساخت نیست"
            echo "===== فایل‌های اجرایی بسته‌بند ====="
            find "$GITHUB_WORKSPACE/$SRC_DIR/libs/portable" -name "*.exe" 2>/dev/null | head -20 || true
            echo "===== پوشهٔ هدف ریشه ====="
            ls -la "$GITHUB_WORKSPACE/$SRC_DIR/target/release" 2>/dev/null | tail -20 || echo "پوشهٔ هدف ریشه نیست"
            echo "===== فهرست پوشهٔ سورس ====="
            ls -la "$GITHUB_WORKSPACE/$SRC_DIR" 2>/dev/null | head -30 || true
          } > "$GITHUB_WORKSPACE/ci-failure-windows.txt"

      - name: ثبت گزارش خطا روی شاخهٔ وضعیت
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          bash branding/tools/ci_note.sh ci-failure-windows.txt "خطای ساخت ویندوز"

      - name: گذاشتن گزارش خطا در Releases
        if: failure()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fail-${{ github.run_number }}
          name: "گزارش خطای ساخت ویندوز - اجرای ${{ github.run_number }}"
          body: "گزارش خودکار خطای مرحلهٔ ساخت ویندوز."
          files: ci-failure-windows.txt

  # -------------------------------------------------------------------------
  # کار سوم: انتشار فایل نصبی و نسخهٔ پرتابل در بخش Releases همین مخزن
  # -------------------------------------------------------------------------
  publish:
    name: انتشار خروجی ساخت
    needs: [bridge, windows]
    if: ${{ needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: گرفتن فایل نصبی از ساخت
        uses: actions/download-artifact@v4
        with:
          name: NRISP-Remote-installer
          path: dist

      - name: گرفتن نسخهٔ پرتابل از ساخت
        uses: actions/download-artifact@v4
        with:
          name: NRISP-Remote-portable
          path: dist

      - name: نمایش فایل‌های آماده
        run: ls -la dist

      - name: انتشار در Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "دسترسی راه دور موسسه - ساخت شمارهٔ ${{ github.run_number }}"
          body: |
            نرم‌افزار دسترسی راه دور موسسه، ساخته‌شده از سورس رسمی راست‌دسک
            با هویت بصری و پنل اختصاصی موسسه تحقیقات سیاست علمی کشور.

            - فایل نصبی ویندوز (۶۴ بیتی)
            - نسخهٔ پرتابل بدون نیاز به نصب
          files: dist/*
          draft: false
          prerelease: false
